<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${heading})}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>

<main>
    <p class="crumb">
        <a th:href="@{/conferences/{id}(id=${conference.id})}"
           th:text="'← ' + ${conference.name}">← Conference</a>
    </p>

    <h1 th:text="${heading}">Session</h1>

    <form th:action="@{${action}}" th:object="${form}" method="post">

        <div th:if="${#fields.hasAnyErrors()}" class="flash error">
            Please correct the highlighted fields.
        </div>

        <label for="title">Title</label>
        <input type="text" id="title" th:field="*{title}" th:errorclass="invalid"
               placeholder="Virtual Threads in Practice">
        <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">error</p>

        <label for="abstractText">Abstract</label>
        <textarea id="abstractText" rows="5" th:field="*{abstractText}" th:errorclass="invalid"
                  placeholder="What the talk covers and who it is for."></textarea>
        <p class="field-error" th:if="${#fields.hasErrors('abstractText')}" th:errors="*{abstractText}">error</p>

        <label for="track">Track</label>
        <input type="text" id="track" th:field="*{track}" th:errorclass="invalid" placeholder="Platform">
        <p class="field-error" th:if="${#fields.hasErrors('track')}" th:errors="*{track}">error</p>
        <p class="hint" th:unless="${#fields.hasErrors('track')}">Optional.</p>

        <label for="publicSummary">Public summary</label>
        <textarea id="publicSummary" rows="3" th:field="*{publicSummary}" th:errorclass="invalid"
                  placeholder="One or two sentences for the printed programme."></textarea>
        <p class="field-error" th:if="${#fields.hasErrors('publicSummary')}" th:errors="*{publicSummary}">error</p>
        <p class="hint" th:unless="${#fields.hasErrors('publicSummary')}">Optional.</p>

        <label for="status">Status</label>
        <select id="status" th:field="*{status}" th:errorclass="invalid">
            <option th:each="value : ${statuses}" th:value="${value}" th:text="${value}">STATUS</option>
        </select>

        <div class="actions">
            <button type="submit" class="primary">Save</button>
            <a class="button" th:href="@{/conferences/{id}(id=${conference.id})}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
