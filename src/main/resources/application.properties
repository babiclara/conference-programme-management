spring.application.name=conference-programme

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/conference}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:conference}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:conference}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health

spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000
