services:
  db:
    image: postgres:17-alpine
    container_name: conference-db
    environment:
      POSTGRES_DB: conference
      POSTGRES_USER: conference
      POSTGRES_PASSWORD: conference
    ports:
      - "5432:5432"
    volumes:
      - conference-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conference -d conference"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: conference-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/conference
      SPRING_DATASOURCE_USERNAME: conference
      SPRING_DATASOURCE_PASSWORD: conference
    ports:
      - "8080:8080"

volumes:
  conference-db-data:
